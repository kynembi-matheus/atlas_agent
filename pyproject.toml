[project]
name = "atlas-agent"
version = "0.1.0"
description = "Assistente de dados e relatórios com FastAPI e PostgreSQL via MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "openai>=1.76,<3",
  "mcp>=1.10,<2",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "sqlglot>=26,<31",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "pypdf>=5,<7",
  "statsmodels>=0.15,<1",
  "arch>=8,<9",
  "pyarrow>=20,<24",
  "xlrd>=2,<3",
]

[dependency-groups]
dev = [
    "xlwt>=1.3,<2",
    "pypdfium2>=4,<6",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
